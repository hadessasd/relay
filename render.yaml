services:
  - type: web
    name: kstudy-academy
    runtime: node
    plan: starter
    buildCommand: npm ci && NITRO_PRESET=node-server npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: node-server
      - key: HOST
        value: 0.0.0.0
      - key: NITRO_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: STAFF_USERNAME
        value: admin
      - key: STAFF_PASSWORD
        sync: false
