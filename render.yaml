services:
  - type: web
    name: kstudy-academy
    runtime: node
    plan: starter
    buildCommand: bash render-build.sh
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: node-server
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: HOST
        value: 0.0.0.0
      - key: NITRO_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: STAFF_USERNAME
        value: admin
      - key: STAFF_PASSWORD
        sync: false
